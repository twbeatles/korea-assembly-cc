# PROJECT_AUDIT_EXTENDED 1단계: 최소 품질 게이트
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest + pyright (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # 이 저장소는 requirements.txt / pyproject.toml 대신
          # requirements-dev.txt 를 단일 의존성 핀 파일로 쓴다.
          # cache: pip 기본 검색 경로만 쓰면 setup-python 이 즉시 실패한다.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q --tb=line

      - name: Run pyright
        run: python -m pyright
