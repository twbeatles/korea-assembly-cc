# 최소 품질 게이트 — pytest + pyright (Windows)
# 로컬 푸시 전: python scripts/install_git_hooks.py && python scripts/check_before_push.py --pyright-only
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: pytest + pyright (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Windows runner 기본 코드페이지에서도 한글 JSON/로그 stdout 이 깨지지 않게 한다.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # README/로컬과 맞춘 지원 축. requirements-dev.txt 핀을 그대로 설치한다.
          python-version: "3.12"
          cache: pip
          # 이 저장소는 requirements.txt / pyproject.toml 대신
          # requirements-dev.txt 를 단일 의존성 핀 파일로 쓴다.
          # cache: pip 기본 검색 경로만 쓰면 setup-python 이 즉시 실패한다.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import pyright, pytest; print('pyright', getattr(pyright, '__version__', '?')); print('pytest', pytest.__version__)"

      - name: Pyright (fail-fast, 0 errors)
        # pytest 보다 먼저 실행해 타입 오류를 조기에 차단한다.
        # 로컬 pre-push 훅(scripts/check_before_push.py)과 동일 진입점.
        run: python scripts/check_before_push.py --pyright-only

      - name: Run pytest
        # test_pyright_regression 포함 — pyright 0 errors 를 테스트로 재검증
        run: python -m pytest -q --tb=line
